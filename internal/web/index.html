<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Markdown Preview</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.8.0/dist/mermaid.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --border: #cfcfcf;
        --text: #1f2937;
        --muted: #6b7280;
        --surface: #f5f5f5;
        --panel: #ffffff;
        --accent: #1d4ed8;
        --toolbar-bg: #ffffff;
        --toolbar-text: #111827;
        --toggle-border: #d1d5db;
        --toggle-bg: #f9fafb;
        --toggle-text: #111827;
        --editor-bg: #fafafa;
        --editor-text: #1d4ed8;
        --preview-text: #111827;
        --heading: #111827;
        --inline-code-bg: #e5e7eb;
        --code-bg: #111827;
        --code-text: #f9fafb;
        --quote-border: #d1d5db;
        --hr: #d1d5db;
        --table-border: #cbd5e1;
        --table-header-bg: #f1f5f9;
      }

      body[data-theme="dark"] {
        color-scheme: dark;
        --border: #252525;
        --text: #ffffff;
        --muted: #b7b7b7;
        --surface: #000000;
        --panel: #000000;
        --accent: #8ab4ff;
        --toolbar-bg: rgba(16, 16, 16, 0.96);
        --toolbar-text: #ffffff;
        --toggle-border: #333333;
        --toggle-bg: #1a1a1a;
        --toggle-text: #f7f7f7;
        --editor-bg: #101010;
        --editor-text: #ededed;
        --preview-text: #ffffff;
        --heading: #ffffff;
        --inline-code-bg: #5f6368;
        --code-bg: #1a1a1a;
        --code-text: #f8f8f2;
        --quote-border: #3a3a3a;
        --hr: #2d2d2d;
        --table-border: #333333;
        --table-header-bg: #181818;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--surface);
        color: var(--text);
        font-family: "Iosevka Fixed", "Fira Code", "SFMono-Regular", Consolas, monospace;
        display: flex;
        flex-direction: column;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--toolbar-bg);
      }

      .toolbar-actions {
        display: flex;
        gap: 0.6rem;
      }

      .toolbar-button {
        border: 1px solid var(--toggle-border);
        border-radius: 999px;
        padding: 0.45rem 0.8rem;
        background: var(--toggle-bg);
        color: var(--toggle-text);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .toolbar-button:hover {
        filter: brightness(0.97);
      }

      body[data-theme="dark"] .toolbar {
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      body[data-theme="dark"] .toolbar-button:hover {
        border-color: #4a4a4a;
        filter: brightness(1.12);
      }

      .markdown-app {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);
        min-height: 0;
        flex: 1 1 auto;
      }

      .markdown-app.preview-only {
        grid-template-columns: 1fr;
      }

      .markdown-app.preview-only .panel-editor {
        display: none;
      }

      .markdown-app.preview-only .panel-preview {
        border-left: 0;
        border-top: 0;
      }

      .panel {
        display: flex;
        min-width: 0;
        background: var(--panel);
      }

      .panel + .panel {
        border-left: 6px solid var(--border);
      }

      .editor {
        flex: 1 1 auto;
        display: block;
        width: 100%;
        min-height: 100%;
        border: 0;
        resize: none;
        padding: 18px 24px;
        background: var(--editor-bg);
        color: var(--editor-text);
        font: inherit;
        font-size: 1rem;
        line-height: 1.45;
        outline: none;
        tab-size: 2;
      }

      .preview-wrap {
        flex: 1 1 auto;
        min-height: 100%;
        padding: 18px 24px 48px;
        overflow: auto;
      }

      .preview {
        max-width: 920px;
        margin: 0 auto;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--preview-text);
      }

      body[data-theme="dark"] .preview {
        max-width: 768px;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        font-size: 1.03rem;
        line-height: 1.58;
      }

      .preview > :first-child {
        margin-top: 0;
      }

      .preview h1,
      .preview h2,
      .preview h3,
      .preview h4,
      .preview h5,
      .preview h6 {
        margin: 0 0 0.6em;
        font-family: "IBM Plex Sans Condensed", "Segoe UI", sans-serif;
        line-height: 1.2;
        color: var(--heading);
      }

      .preview h1 {
        font-size: 3rem;
        font-weight: 700;
        border-bottom: 2px solid var(--hr);
        padding-bottom: 0.3em;
      }

      .preview h2 {
        font-size: 2.25rem;
      }

      body[data-theme="dark"] .preview h1 {
        font-size: 2rem;
        border-bottom-width: 1px;
      }

      body[data-theme="dark"] .preview h2 {
        font-size: 1.5rem;
        padding-top: 1.1rem;
      }

      body[data-theme="dark"] .preview h3 {
        font-size: 1.25rem;
        padding-top: 1rem;
      }

      body[data-theme="dark"] .preview h4,
      body[data-theme="dark"] .preview h5,
      body[data-theme="dark"] .preview h6 {
        padding-top: 0.7rem;
      }

      .preview p,
      .preview ul,
      .preview ol,
      .preview table,
      .preview pre,
      .preview blockquote,
      .preview hr {
        margin: 0 0 1rem;
      }

      .preview ul,
      .preview ol {
        padding-left: 1.6rem;
      }

      .preview li + li {
        margin-top: 0.2rem;
      }

      .preview a {
        color: var(--accent);
      }

      .preview code {
        padding: 0.12rem 0.35rem;
        border-radius: 4px;
        background: var(--inline-code-bg);
        font-family: "Iosevka Fixed", "Fira Code", monospace;
        font-size: 0.95em;
      }

      .preview pre {
        overflow-x: auto;
        padding: 0.85rem 1rem;
        border-radius: 8px;
        background: var(--code-bg);
        color: var(--code-text);
      }

      body[data-theme="dark"] .preview code {
        color: #ffffff;
      }

      body[data-theme="dark"] .preview pre {
        padding: 1rem 1.25rem;
        border: 1px solid #202020;
        border-radius: 18px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      body[data-theme="dark"] .preview pre code {
        font-size: 0.84rem;
        line-height: 1.6;
      }

      .preview pre code {
        padding: 0;
        background: transparent;
        color: inherit;
      }

      .preview blockquote {
        padding-left: 1rem;
        border-left: 4px solid var(--quote-border);
        color: var(--muted);
      }

      body[data-theme="dark"] .preview strong {
        color: #ffffff;
        font-weight: 700;
      }

      body[data-theme="dark"] .preview hr {
        margin: 2rem 0;
      }

      body[data-theme="dark"] .preview blockquote {
        border-left-width: 3px;
      }

      .preview hr {
        border: 0;
        border-top: 1px solid var(--hr);
      }

      .preview table {
        border-collapse: collapse;
      }

      .preview th,
      .preview td {
        padding: 0.65rem 0.9rem;
        border: 1px solid var(--table-border);
        text-align: left;
      }

      .preview th {
        font-weight: 700;
        background: var(--table-header-bg);
      }

      body[data-theme="dark"] .preview th,
      body[data-theme="dark"] .preview td {
        background-clip: padding-box;
      }

      .preview ul .task-list-item {
        list-style-type: none;
        margin-left: -1.2rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .preview .task-list-item input[type="checkbox"] {
        margin: 0;
        cursor: default;
      }

      .preview .markdown-alert {
        margin: 1.25rem 0;
        padding: 0.85rem 1.15rem;
        border-left: 4px solid var(--accent);
        border-radius: 6px;
        background: rgba(29, 78, 216, 0.06);
      }

      .preview .markdown-alert-note {
        border-left-color: #2563eb;
        background: rgba(37, 99, 235, 0.08);
      }

      .preview .markdown-alert-tip {
        border-left-color: #16a34a;
        background: rgba(22, 163, 74, 0.08);
      }

      .preview .markdown-alert-important {
        border-left-color: #8b5cf6;
        background: rgba(139, 92, 246, 0.08);
      }

      .preview .markdown-alert-warning {
        border-left-color: #ea580c;
        background: rgba(234, 88, 12, 0.08);
      }

      .preview .markdown-alert-caution {
        border-left-color: #dc2626;
        background: rgba(220, 38, 38, 0.08);
      }

      .preview .markdown-alert-title {
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.05em;
        margin: 0 0 0.35rem;
        text-transform: uppercase;
      }

      .preview .markdown-alert-note .markdown-alert-title { color: #2563eb; }
      .preview .markdown-alert-tip .markdown-alert-title { color: #16a34a; }
      .preview .markdown-alert-important .markdown-alert-title { color: #8b5cf6; }
      .preview .markdown-alert-warning .markdown-alert-title { color: #ea580c; }
      .preview .markdown-alert-caution .markdown-alert-title { color: #dc2626; }

      body[data-theme="dark"] .preview .markdown-alert-note .markdown-alert-title { color: #60a5fa; }
      body[data-theme="dark"] .preview .markdown-alert-tip .markdown-alert-title { color: #4ade80; }
      body[data-theme="dark"] .preview .markdown-alert-important .markdown-alert-title { color: #c084fc; }
      body[data-theme="dark"] .preview .markdown-alert-warning .markdown-alert-title { color: #fb923c; }
      body[data-theme="dark"] .preview .markdown-alert-caution .markdown-alert-title { color: #f87171; }

      .preview .mermaid-block,
      .preview .math-block {
        margin: 1.25rem 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--toggle-bg);
      }

      .preview .mermaid-label,
      .preview .math-label {
        padding: 0.35rem 0.85rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        background: var(--table-header-bg);
      }

      .preview .mermaid-block pre,
      .preview .math-block pre {
        margin: 0;
        border-radius: 0;
        border: 0;
      }

      .preview .math-inline {
        padding: 0.1rem 0.3rem;
      }

      .preview .mermaid-render {
        padding: 1.25rem 1rem;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: auto;
      }

      .preview .mermaid-render svg {
        max-width: 100%;
        height: auto;
      }

      .preview .math-render {
        padding: 1.25rem 1rem;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: auto;
        font-size: 1.25rem;
      }

      .preview .footnotes {
        margin-top: 2.5rem;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .preview .footnotes-sep {
        margin: 1.5rem 0;
      }

      .preview .footnote-ref a,
      .preview .footnote-backref {
        text-decoration: none;
        color: var(--accent);
      }

      .preview .empty {
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .markdown-app {
          grid-template-columns: 1fr;
        }

        .panel + .panel {
          border-left: 0;
          border-top: 6px solid var(--border);
        }

        .editor,
        .preview-wrap {
          min-height: 50vh;
          height: 50vh;
        }

        .preview-wrap {
          overflow: auto;
        }

        .editor {
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-actions">
        <button id="view-toggle" class="toolbar-button" type="button" aria-pressed="false">
          Preview only
        </button>
        <button id="theme-toggle" class="toolbar-button" type="button" aria-pressed="false">
          Dark mode
        </button>
      </div>
    </header>
    <main class="markdown-app">
      <section class="panel panel-editor">
        <textarea id="editor" class="editor" spellcheck="false">
# Markdown 2026 Specification Showcase

This document demonstrates all supported standard Markdown features and modern 2026 extensions.

---

## 1. Block Elements

### Headings (H1 to H6)

## Heading 2
### Heading 3
#### Heading 4
##### Heading 5
###### Heading 6

### Paragraphs & Line Breaks
This is a standard paragraph demonstrating text flow across lines.

This line ends with two spaces to create a line break:  
Here is the broken line.  
Alternatively, you can use the break tag: Line one<br>Line two.

### Blockquotes
> This is a single-level blockquote spanning multiple lines.
> Knowledge increases by sharing, not by saving.
>> This is a nested blockquote providing further detail.

### Lists
#### Unordered Lists
- Unordered item with hyphen
  - Sub-item level 2 (2 spaces indented)
    - Sub-item level 3 (4 spaces indented)
* Unordered item with asterisk
+ Unordered item with plus sign

#### Ordered Lists
1. First step
2. Second step
   1. Sub-step 2.1
   2. Sub-step 2.2
3. Third step

#### Task Lists
- [x] Review the 2026 specification document
- [x] Design renderer architecture
- [ ] Implement parser extensions
- [ ] Verify test suite coverage

### Fenced Code Blocks
Backtick block with language syntax:
```typescript
interface UserProfile {
  id: string;
  username: string;
  active: boolean;
}

export function greet(user: UserProfile): string {
  return `Hello, ${user.username}!`;
}
```

Tilde block without language:
~~~bash
echo "Fenced code blocks also support tildes"
~~~

- Italic with underscores: _italic text_
- Bold with asterisks: **bold text**

- Bold and italic with asterisks: ***bold and italic text***
- Bold and italic with underscores: ___bold and italic text___
- Strikethrough: ~~strikethrough text~~

### Links & Autolinks

## 4. Embedded HTML

        </textarea>
      </section>
      <section class="panel panel-preview">
        <div class="preview-wrap">
          <article id="preview" class="preview" aria-live="polite"></article>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "mdpreview_state";
      const THEME_KEY = "mdpreview_theme";
      const VIEW_MODE_SPLIT = "split";
      const VIEW_MODE_PREVIEW_ONLY = "preview-only";
      const editor = document.getElementById("editor");
      const preview = document.getElementById("preview");
      const themeToggle = document.getElementById("theme-toggle");
      const viewToggle = document.getElementById("view-toggle");
      const markdownApp = document.querySelector(".markdown-app");
      const defaultMarkdown = editor.value;
      let renderTimer = null;
      let renderSequence = 0;

      async function requestPreview(markdownValue, sequence) {
        const response = await fetch("/api/render", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ markdown: markdownValue }),
        });

        if (!response.ok) {
          throw new Error(`render request failed with status ${response.status}`);
        }

        const body = await response.json();
        if (typeof body.html !== "string") {
          throw new Error("invalid render response");
        }

        if (sequence === renderSequence) {
          preview.innerHTML = body.html;
          renderDynamicExtensions();
        }
      }

      async function renderDynamicExtensions() {
        if (window.katex) {
          preview.querySelectorAll(".math-inline").forEach((el) => {
            const code = el.querySelector("code");
            const formula = code ? code.textContent : el.textContent;
            try {
              katex.render(formula, el, {
                displayMode: false,
                throwOnError: false,
              });
            } catch (err) {
              console.warn("KaTeX inline render error:", err);
            }
          });

          preview.querySelectorAll(".math-block").forEach((block) => {
            const code = block.querySelector("pre.math-display code");
            if (!code) return;
            const formula = code.textContent;
            let target = block.querySelector(".math-render");
            if (!target) {
              target = document.createElement("div");
              target.className = "math-render";
              block.appendChild(target);
            }
            try {
              katex.render(formula, target, {
                displayMode: true,
                throwOnError: false,
              });
              const pre = block.querySelector("pre.math-display");
              if (pre) pre.style.display = "none";
            } catch (err) {
              console.warn("KaTeX display render error:", err);
            }
          });
        }

        if (window.mermaid) {
          const isDark = document.body.dataset.theme === "dark";
          mermaid.initialize({
            startOnLoad: false,
            theme: isDark ? "dark" : "default",
            securityLevel: "loose",
          });

          const mermaidBlocks = preview.querySelectorAll(".mermaid-block");
          for (let i = 0; i < mermaidBlocks.length; i++) {
            const block = mermaidBlocks[i];
            const code = block.querySelector("code.language-mermaid");
            if (!code) continue;
            const graphText = code.textContent.trim();
            if (!graphText) continue;

            try {
              const renderId = "mermaid-svg-" + i + "-" + Math.floor(Math.random() * 1000000);
              const { svg } = await mermaid.render(renderId, graphText);
              let target = block.querySelector(".mermaid-render");
              if (!target) {
                target = document.createElement("div");
                target.className = "mermaid-render";
                block.appendChild(target);
              }
              target.innerHTML = svg;
              const pre = block.querySelector("pre");
              if (pre) pre.style.display = "none";
            } catch (err) {
              console.warn("Mermaid render error:", err);
            }
          }
        }
      }

      function updatePreview() {
        renderSequence += 1;
        const currentSequence = renderSequence;

        if (renderTimer !== null) {
          clearTimeout(renderTimer);
        }

        renderTimer = setTimeout(() => {
          requestPreview(editor.value, currentSequence).catch(() => {
            if (currentSequence === renderSequence) {
              preview.innerHTML = '<p class="empty">Preview unavailable. Keep typing to retry.</p>';
            }
          });
        }, 80);
      }

      function saveEditorState() {
        try {
          localStorage.setItem(STORAGE_KEY, editor.value);
        } catch (_error) {
          // Ignore storage failures and keep the editor functional.
        }
      }

      function loadEditorState() {
        try {
          const savedMarkdown = localStorage.getItem(STORAGE_KEY);
          if (savedMarkdown !== null) {
            editor.value = savedMarkdown;
          } else {
            editor.value = defaultMarkdown;
          }
        } catch (_error) {
          editor.value = defaultMarkdown;
        }
      }

      function saveTheme(theme) {
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (_error) {
          // Ignore storage failures and keep the interface functional.
        }
      }

      function setTheme(theme) {
        document.body.dataset.theme = theme;
        themeToggle.setAttribute("aria-pressed", String(theme === "dark"));
        themeToggle.textContent = theme === "dark" ? "Light mode" : "Dark mode";
      }

      function loadTheme() {
        try {
          const storedTheme = localStorage.getItem(THEME_KEY);
          if (storedTheme === "dark" || storedTheme === "light") {
            return storedTheme;
          }
        } catch (_error) {
          // Ignore storage failures and use safe fallback.
        }

        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          return "dark";
        }

        return "light";
      }

      function setViewMode(mode) {
        const isPreviewOnly = mode === VIEW_MODE_PREVIEW_ONLY;
        markdownApp.classList.toggle(VIEW_MODE_PREVIEW_ONLY, isPreviewOnly);
        viewToggle.setAttribute("aria-pressed", String(isPreviewOnly));
        viewToggle.textContent = isPreviewOnly ? "Show editor" : "Preview only";
      }

      editor.addEventListener("input", () => {
        saveEditorState();
        updatePreview();
      });

      viewToggle.addEventListener("click", () => {
        const nextMode = markdownApp.classList.contains(VIEW_MODE_PREVIEW_ONLY)
          ? VIEW_MODE_SPLIT
          : VIEW_MODE_PREVIEW_ONLY;
        setViewMode(nextMode);
      });

      themeToggle.addEventListener("click", () => {
        const nextTheme = document.body.dataset.theme === "dark" ? "light" : "dark";
        setTheme(nextTheme);
        saveTheme(nextTheme);
        renderDynamicExtensions();
      });

      window.addEventListener("load", () => {
        renderDynamicExtensions();
      });

      loadEditorState();
      setViewMode(VIEW_MODE_SPLIT);
      setTheme(loadTheme());
      updatePreview();
    </script>
  </body>
</html>
